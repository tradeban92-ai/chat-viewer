<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat Viewer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14; --surface:#13161e; --surface2:#1a1e2a; --surface3:#222739;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
  --accent:#6c63ff; --accent-dim:rgba(108,99,255,.14);
  --text:#e8eaf0; --text2:#b6bccb; --muted:#8b90a0; --muted2:#666d80;
  /* серии графиков — проверенная палитра для тёмной подложки */
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --grid:rgba(255,255,255,.055); --axis:rgba(255,255,255,.12);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Golos Text',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);}
::-webkit-scrollbar-track{background:transparent;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,select{font:inherit;}
.u{font-family:'Unbounded',sans-serif;}

/* ─── верхняя панель ─── */
.topbar{display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;height:52px;}
.logo{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:0 16px;border-right:1px solid var(--border);height:100%;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.tabs{display:flex;flex:1;overflow-x:auto;scrollbar-width:none;height:100%;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:0 18px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted);border-right:1px solid var(--border);transition:color .15s,background .15s;position:relative;white-space:nowrap;height:100%;display:flex;align-items:center;gap:7px;flex-shrink:0;}
.tab:hover{color:var(--text);background:var(--surface2);}
.tab.active{color:var(--text);background:var(--surface2);}
.tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent);}
.badge{background:var(--accent-dim);color:#a7a1ff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;font-variant-numeric:tabular-nums;}
.tab.active .badge{background:var(--accent);color:#fff;}
.status{padding:0 16px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0;font-variant-numeric:tabular-nums;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex-shrink:0;box-shadow:0 0 0 3px rgba(12,163,12,.15);}
.dot.live{animation:pulse 2.4s infinite;}
.dot.err{background:var(--crit);box-shadow:0 0 0 3px rgba(208,59,59,.15);animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.body{display:flex;flex:1;overflow:hidden;}

/* ─── сайдбар ─── */
.sidebar{width:300px;min-width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-head{padding:12px 12px 0;flex-shrink:0;}
.search{position:relative;margin-bottom:10px;}
.search input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px 9px 34px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s,background .15s;}
.search input:focus{border-color:var(--accent);background:var(--surface3);}
.search input::placeholder{color:var(--muted2);}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4;}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:500;background:var(--surface2);border:1px solid var(--border);color:var(--muted);white-space:nowrap;transition:.15s;}
.chip:hover{color:var(--text);border-color:var(--border2);}
.chip.on{background:var(--accent-dim);border-color:rgba(108,99,255,.45);color:#b5b0ff;}
.user-list{flex:1;overflow-y:auto;padding:0 8px 10px;}

.ucard{border-radius:var(--r);padding:11px;margin-bottom:4px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;position:relative;}
.ucard:hover{background:var(--surface2);}
.ucard.on{background:var(--surface2);border-color:rgba(108,99,255,.4);}
.ucard.on::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--accent);}
.uc-row{display:flex;align-items:center;gap:10px;}
.av{border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:600;flex-shrink:0;width:38px;height:38px;font-size:12px;}
.uc-mid{flex:1;min-width:0;}
.uc-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.uc-time{font-size:10.5px;color:var(--muted2);margin-top:2px;}
.cnt{background:var(--surface3);color:var(--text2);font-size:10px;font-weight:700;padding:3px 7px;border-radius:20px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.uc-last{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.uc-tags{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;}

/* ─── теги интентов ─── */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:5px;letter-spacing:.02em;line-height:1.5;}
.t-booking{background:rgba(25,158,112,.14);color:#3fcf9b;}
.t-price{background:rgba(201,133,0,.15);color:#e5aa33;}
.t-faq{background:rgba(57,135,229,.14);color:#68a6f0;}
.t-contra{background:rgba(213,81,129,.14);color:#e884a8;}
.t-human{background:rgba(208,59,59,.18);color:#f07575;}
.t-service{background:rgba(144,133,233,.15);color:#a9a1f0;}
.t-other{background:rgba(255,255,255,.05);color:var(--muted);}

/* ─── основная область ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.back{display:none;align-items:center;gap:8px;padding:11px 16px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;color:var(--accent);flex-shrink:0;width:100%;}

.chead{padding:13px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:13px;background:var(--surface);flex-shrink:0;}
.chead .av{width:42px;height:42px;font-size:14px;border-radius:11px;}
.ch-mid{flex:1;min-width:0;}
.ch-mid h2{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-mid p{font-size:11px;color:var(--muted2);margin-top:3px;}
.ch-stats{display:flex;gap:22px;flex-shrink:0;}
.st{text-align:right;}
.st-v{font-size:16px;font-weight:600;line-height:1.1;}
.st-l{font-size:9.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;}

.msgs{flex:1;overflow-y:auto;padding:18px 24px 24px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth;}
.dsep{text-align:center;margin:16px 0 10px;position:sticky;top:-4px;z-index:5;pointer-events:none;}
.dsep span{font-size:10px;color:var(--muted);background:var(--surface2);padding:4px 13px;border-radius:20px;border:1px solid var(--border);font-weight:500;backdrop-filter:blur(8px);}
.row{display:flex;gap:9px;align-items:flex-end;}
.row.me{flex-direction:row-reverse;}
.row+.row{margin-top:2px;}
.row.gap{margin-top:12px;}
.mav{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;font-family:'Unbounded',sans-serif;}
.mav.ghost{visibility:hidden;}
.bw{display:flex;flex-direction:column;max-width:min(620px,74%);min-width:0;}
.row.me .bw{align-items:flex-end;}
.bub{padding:9px 13px;border-radius:15px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;border:1px solid transparent;}
.row.me .bub{background:#1f2338;border-color:rgba(108,99,255,.22);border-bottom-right-radius:5px;}
.row.bot .bub{background:#17211c;border-color:rgba(25,158,112,.2);border-bottom-left-radius:5px;}
.btime{font-size:9.5px;color:var(--muted2);margin-top:4px;padding:0 3px;font-variant-numeric:tabular-nums;}
.row.me .btime{text-align:right;}
.navp{text-align:center;margin:5px 0;}
.navp span{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:10.5px;color:var(--muted);}
.fab{position:absolute;right:24px;bottom:24px;width:38px;height:38px;border-radius:50%;background:var(--surface3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;}
.fab.on{opacity:1;pointer-events:auto;}

/* ─── общий контейнер вкладок 2/3 ─── */
.pane{flex:1;overflow-y:auto;padding:18px 24px 28px;}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.toolbar .search{margin:0;flex:1;min-width:180px;max-width:340px;}
.sel{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:12.5px;outline:none;cursor:pointer;}
.sel:focus{border-color:var(--accent);}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:500;color:var(--text2);display:inline-flex;align-items:center;gap:7px;transition:.15s;text-decoration:none;}
.btn:hover{border-color:var(--border2);color:var(--text);background:var(--surface3);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.pri:hover{background:#5b52f0;}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.kpi-l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.kpi-v{font-size:26px;font-weight:600;margin-top:7px;line-height:1;letter-spacing:-.02em;}
.kpi-s{font-size:11px;color:var(--muted2);margin-top:6px;}
.kpi-s b{color:var(--good);font-weight:600;}
.kpi-s b.dn{color:var(--crit);}

/* карточки пользователей */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start;}
.upc{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;transition:border-color .15s;}
.upc:hover{border-color:var(--border2);}
.upc-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.upc-top .av{width:46px;height:46px;font-size:15px;border-radius:13px;}
.upc-name{font-size:14.5px;font-weight:600;}
.upc-id{font-size:11px;color:var(--muted2);margin-top:3px;font-variant-numeric:tabular-nums;}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.dcell{background:var(--surface2);border-radius:10px;padding:9px 11px;}
.dcell-l{color:var(--muted2);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px;}
.dcell-v{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;}
.mem{background:linear-gradient(180deg,rgba(108,99,255,.09),rgba(108,99,255,.03));border:1px solid rgba(108,99,255,.18);border-radius:12px;padding:11px 13px;}
.mem-l{font-size:9.5px;color:#a7a1ff;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.mem-t{font-size:12.5px;line-height:1.6;color:var(--text2);}
.mem-t.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.more{font-size:11px;color:var(--accent);margin-top:7px;font-weight:500;}
.upc-foot{margin-top:12px;}
.upc-foot .btn{width:100%;justify-content:center;padding:8px;}

/* ─── графики ─── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px 14px;min-width:0;}
.card.wide{grid-column:1/-1;}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px;}
.card-t{font-size:13.5px;font-weight:600;}
.card-sub{font-size:11px;color:var(--muted2);margin-top:3px;}
.tbtn{font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:7px;padding:3px 8px;flex-shrink:0;}
.tbtn:hover{color:var(--text);border-color:var(--border2);}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 2px;}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text2);}
.lg i{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.plot{position:relative;margin-top:8px;}
.plot svg{display:block;width:100%;}
.tip{position:absolute;pointer-events:none;background:#0a0c12;border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:11.5px;white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:0 8px 28px rgba(0,0,0,.6);z-index:20;}
.tip b{font-weight:600;display:block;margin-bottom:5px;font-size:11px;color:var(--muted);}
.tip .tr{display:flex;align-items:center;gap:7px;line-height:1.7;}
.tip .tr i{width:8px;height:8px;border-radius:2px;}
.tip .tr span{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;padding-left:14px;}

.bars{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
.bar{display:grid;grid-template-columns:minmax(90px,44%) 1fr auto;align-items:center;gap:11px;}
.bar-l{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-tr{height:9px;background:rgba(255,255,255,.045);border-radius:5px;overflow:hidden;}
.bar-f{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.bar-v{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:38px;text-align:right;}

table.dt{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
table.dt th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--border);}
table.dt td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.035);font-variant-numeric:tabular-nums;}
table.dt td:first-child{font-variant-numeric:normal;color:var(--text2);}
table.dt tr:last-child td{border-bottom:none;}
table.dt td.num,table.dt th.num{text-align:right;}
.tscroll{overflow-x:auto;}
.tw{display:none;max-height:280px;overflow:auto;}
.tw.on{display:block;}

/* состояния */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted2);gap:14px;padding:40px;text-align:center;}
.empty svg{opacity:.18;}
.empty p{font-size:13px;}
.load{display:flex;align-items:center;justify-content:center;gap:11px;color:var(--muted);font-size:12.5px;padding:44px;}
.sp{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.note{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.65;color:var(--text2);margin-bottom:16px;}
.note b{color:var(--text);}
.note code{background:var(--surface3);padding:1px 6px;border-radius:5px;font-size:11.5px;font-family:ui-monospace,monospace;}
.note ol{margin:9px 0 0 18px;}
.note li{margin-bottom:5px;}
.note a{color:#8b84ff;}
.fade{opacity:.45;transition:opacity .2s;}

@media(max-width:860px){.ch-stats{gap:16px}}
@media(max-width:640px){
  .logo{display:none;}
  .sidebar{position:absolute;top:52px;left:0;bottom:0;z-index:100;width:100%;min-width:0;}
  .sidebar.hide{display:none;}
  .main{width:100%;}
  .back{display:flex;}
  .ch-stats{display:none;}
  .bw{max-width:86%;}
  .msgs{padding:14px 14px 20px;}
  .pane{padding:14px;}
  .ugrid{grid-template-columns:1fr;}
  .cards{grid-template-columns:1fr;}
  .chead{padding:11px 14px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">💬 Chat Viewer</div>
  <div class="tabs">
    <button class="tab active" id="tab0" onclick="switchTab(0)">Сообщения <span class="badge" id="b0">···</span></button>
    <button class="tab" id="tab1" onclick="switchTab(1)">Пользователи <span class="badge" id="b1">···</span></button>
    <button class="tab" id="tab2" onclick="switchTab(2)">📊 Аналитика</button>
  </div>
  <div class="status"><div class="dot live" id="dot"></div><span id="stamp">···</span></div>
</div>

<div class="body">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Поиск по имени и сообщениям…" id="q" oninput="renderList()">
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="user-list" id="ulist"><div class="load"><div class="sp"></div> Загрузка…</div></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   1. ИСТОЧНИКИ ДАННЫХ
   ══════════════════════════════════════════════════════════════ */
const URLS = {
  messages: "https://script.google.com/macros/s/AKfycbzAYsJMCtW3XykCJdWB6dRKft8GkhmUeFEqiWg5Xaj4iu8iPodBbWzb5EPDEdj4fleU/exec",
  users:    "https://script.google.com/macros/s/AKfycbwO0wDmweTz3M3KpUsWwDBHsWEfHtahb9AfxgI310ljmUmBjgkxJye8tArbvrike5O_FQ/exec"
};

/* ── АНАЛИТИКА: вставьте сюда URL прокси (proxy.gs) и свой ключ ── */
const ANALYTICS = {
  proxy: "",              // ← https://script.google.com/macros/s/.../exec
  key:   "",              // ← значение ACCESS_KEY из свойств скрипта
  counter: "106305671",
  site: "altyeva.ru",
  tilda: "https://stats.tilda.ru/projects/statistics/?projectid=19542786"
};

/* ══════════════════════════════════════════════════════════════
   2. УТИЛИТЫ
   ══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => (Number(n)||0).toLocaleString('ru-RU');
const nf1 = n => (Number(n)||0).toLocaleString('ru-RU',{maximumFractionDigits:1});

const COLORS=[["#6c63ff","#1e1a3d"],["#ff6584","#3d1a22"],["#43e97b","#123a24"],["#f7b731","#3a2d0f"],["#45aaf2","#152b3b"],["#fd9644","#3a2410"],["#a29bfe","#1f1c3a"],["#fd79a8","#3a1a2b"]];
const cmap={}; let ci=0;
const color = uid => cmap[uid] || (cmap[uid]=COLORS[ci++%COLORS.length]);
const initials = n => (String(n).trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'??');

const TL={ask_indications:"показания",ask_price:"цена",ask_booking:"запись",booking_start:"запись",ask_faq:"FAQ",ask_location:"адрес",ask_contraindications:"⚠ противопоказания",needs_human:"🔴 оператор",ask_services:"услуги",other:"другое",browse_menu:"меню",view_service:"просмотр"};

function parseTs(str){
  if(!str) return 0;
  str=String(str).trim();
  if(/^\d{2}\.\d{2}\.\d{4}/.test(str)){
    const [d,t]=str.split(' '), [dd,mm,yy]=d.split('.');
    return new Date(`${yy}-${mm}-${dd}T${t||'00:00:00'}`).getTime();
  }
  return new Date(str).getTime()||0;
}
function fmtTs(str){
  const ts=parseTs(str); if(!ts) return String(str||'');
  const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function rel(ts){
  if(!ts) return '';
  const m=Math.floor((Date.now()-ts)/6e4);
  if(m<1) return 'только что';
  if(m<60) return `${m} мин назад`;
  if(m<1440) return `${Math.floor(m/60)} ч назад`;
  if(m<10080) return `${Math.floor(m/1440)} д назад`;
  return new Date(ts).toLocaleDateString('ru-RU');
}

let msgUsers=[], userRows=[], tab=0, activeUid=null, filter='all', analyticsLoaded=false;

function buildUsers(rows){
  const map={};
  rows.forEach(r=>{
    const uid=String(r['user_id']||r['uid']||r['user_name']||'');
    const name=String(r['user_name']||r['name']||r['user']||'');
    if(!uid||!name) return;
    map[uid] ||= {uid,name,msgs:[],lastTs:0,intents:new Set()};
    const m={
      ts: fmtTs(String(r['ts']||r['date']||'')),
      role: String(r['role']||'').toLowerCase(),
      text: String(r['text']||''),
      intent: String(r['intent']||r['tag']||''),
      reply: String(r['ответ бота']||r['bot_reply']||r['reply']||'')
    };
    map[uid].msgs.push(m);
    if(m.intent && !['browse_menu','view_service','other',''].includes(m.intent)) map[uid].intents.add(m.intent);
    const t=parseTs(m.ts); if(t>map[uid].lastTs) map[uid].lastTs=t;
  });
  return Object.values(map).map(u=>{
    u.questions=u.msgs.filter(m=>m.role==='user'&&!m.text.startsWith('['));
    u.answers=u.msgs.filter(m=>m.role==='bot'&&m.reply);
    return u;
  }).sort((a,b)=>b.lastTs-a.lastTs);
}

async function getJSON(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

async function loadAll(silent){
  if(!silent) $('ulist').innerHTML='<div class="load"><div class="sp"></div> Загрузка…</div>';
  let ok=false;
  try{
    const [msgs,users]=await Promise.all([getJSON(URLS.messages),getJSON(URLS.users)]);
    msgUsers=buildUsers(msgs);
    userRows=[...users].filter(r=>r['user_name']||r['name'])
      .sort((a,b)=>parseTs(b['last_seen']||b['updated_at'])-parseTs(a['last_seen']||a['updated_at']));
    $('b0').textContent=nf(msgUsers.length);
    $('b1').textContent=nf(userRows.length);
    ok=true;
  }catch(e){ console.error(e); $('b0').textContent='!'; $('b1').textContent='!'; }
  $('dot').className='dot '+(ok?'live':'err');
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  $('stamp').textContent=`${p(d.getHours())}:${p(d.getMinutes())}`;
  if(tab===0){ renderList(); if(activeUid){const u=msgUsers.find(x=>x.uid===activeUid); if(u) renderChat(u,false);} }
  else if(tab===1) renderUsers();
}

/* ══════════════════════════════════════════════════════════════
   5. ГРАФИКИ (самописные SVG, без внешних библиотек)
   ══════════════════════════════════════════════════════════════ */
function lineChart(host, cfg){
  const W=host.clientWidth||600, H=cfg.height||230;
  const P={l:46,r:18,t:14,b:26};
  const n=cfg.labels.length;
  if(!n){ host.innerHTML='<div class="empty" style="padding:30px"><p>Нет данных</p></div>'; return; }
  const max=Math.max(1,...cfg.series.flatMap(s=>s.values));
  const step=n>1?(W-P.l-P.r)/(n-1):0;
  const X=i=>P.l+i*step, Y=v=>P.t+(H-P.t-P.b)*(1-v/max);

  // сетка
  const ticks=4, grid=[], ylab=[];
  for(let i=0;i<=ticks;i++){
    const v=max*i/ticks, y=Y(v);
    grid.push(`<line x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`);
    ylab.push(`<text x="${P.l-9}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted2)">${nf(Math.round(v))}</text>`);
  }
  // подписи X
  const every=Math.max(1,Math.ceil(n/6)), xlab=[];
  cfg.labels.forEach((l,i)=>{ if(i%every===0||i===n-1)
    xlab.push(`<text x="${X(i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--muted2)">${esc(l)}</text>`); });

  const paths=cfg.series.map(s=>{
    const d=s.values.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    const li=n-1;
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            <circle cx="${X(li).toFixed(1)}" cy="${Y(s.values[li]).toFixed(1)}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }).join('');

  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" height="${H}">
    ${grid.join('')}${ylab.join('')}${xlab.join('')}
    <g id="cross" style="opacity:0"><line y1="${P.t}" y2="${H-P.b}" stroke="var(--border2)" stroke-width="1"/></g>
    ${paths}
    <g id="dots" style="opacity:0"></g>
  </svg><div class="tip"></div>`;

  const svg=host.querySelector('svg'), tip=host.querySelector('.tip');
  const cross=svg.querySelector('#cross'), dots=svg.querySelector('#dots');
  const move=e=>{
    const r=svg.getBoundingClientRect();
    const px=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*W;
    let i=step?Math.round((px-P.l)/step):0; i=Math.max(0,Math.min(n-1,i));
    cross.style.opacity=1; dots.style.opacity=1;
    cross.querySelector('line').setAttribute('x1',X(i)); cross.querySelector('line').setAttribute('x2',X(i));
    dots.innerHTML=cfg.series.map(s=>`<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
    tip.innerHTML=`<b>${esc(cfg.tipLabels?cfg.tipLabels[i]:cfg.labels[i])}</b>`+
      cfg.series.map(s=>`<div class="tr"><i style="background:${s.color}"></i>${esc(s.name)}<span>${nf(s.values[i])}</span></div>`).join('');
    tip.style.opacity=1;
    const tw=tip.offsetWidth, left=X(i)/W*r.width;
    tip.style.left=Math.max(4,Math.min(r.width-tw-4,left-tw/2))+'px';
    tip.style.top='2px';
  };
  svg.addEventListener('mousemove',move);
  svg.addEventListener('touchmove',e=>{move(e);},{passive:true});
  svg.addEventListener('mouseleave',()=>{tip.style.opacity=0;cross.style.opacity=0;dots.style.opacity=0;});
}

}

function renderAnalytics(){
  if(!ANALYTICS.proxy){ $('main').innerHTML=`<div class="pane">${setupNote()}</div>`; return; }
  $('main').innerHTML=`<div class="pane">
    <div class="toolbar">
      <div class="chips" style="padding:0">
        ${[7,30,90].map(d=>`<button class="chip${period===d?' on':''}" onclick="period=${d};renderAnalytics()">${d} дней</button>`).join('')}
      </div>
      <div style="flex:1"></div>
      <a class="btn" href="https://metrika.yandex.ru/dashboard?id=${ANALYTICS.counter}" target="_blank" rel="noopener">Метрика ↗</a>
      <a class="btn" href="${ANALYTICS.tilda}" target="_blank" rel="noopener">Статистика Tilda ↗</a>
    </div>
    <div id="an"><div class="load"><div class="sp"></div> Запрашиваю Метрику…</div></div>
  </div>`;
  loadAnalytics();
}

async function loadAnalytics(){
  const box=$('an');
  try{
    const [sum,tl,src,dev,pg]=await Promise.all([
      getJSON(mUrl('summary')), getJSON(mUrl('timeline')), getJSON(mUrl('sources')),
      getJSON(mUrl('devices')), getJSON(mUrl('pages'))
    ]);
    for(const r of [sum,tl,src,dev,pg]) if(r.error) throw new Error(r.error);

    const T=sum.totals||[0,0,0,0,0,0];
    const days=(tl.data||[]).map(r=>r.dimensions[0].name);
    const visits=(tl.data||[]).map(r=>r.metrics[0]);
    const users=(tl.data||[]).map(r=>r.metrics[1]);
    const shortD=days.map(d=>{const [y,m,dd]=d.split('-');return `${dd}.${m}`;});
    const dur=Math.round(T[4]||0);

    box.innerHTML=`
      <div class="kpis">
        ${kpi('Визиты',nf(T[0]))}
        ${kpi('Посетители',nf(T[1]))}
        ${kpi('Просмотры',nf(T[2]),`${nf1(T[0]?T[2]/T[0]:0)} на визит`)}
        ${kpi('Отказы',nf1(T[3])+'%')}
        ${kpi('Время на сайте',`${Math.floor(dur/60)}:${String(dur%60).padStart(2,'0')}`,'мин:сек')}
        ${kpi('Новые',nf1(T[5])+'%',' от посетителей')}
      </div>
      <div class="cards">
        <div class="card wide">
          <div class="card-head">
            <div><div class="card-t">Визиты и посетители по дням</div>
              <div class="card-sub">${esc(ANALYTICS.site)} · счётчик ${esc(ANALYTICS.counter)} · за ${period} дней</div></div>
            <button class="tbtn" onclick="toggleTable(this)">Таблица</button>
          </div>
          <div class="legend">
            <span class="lg"><i style="background:var(--s1)"></i>Визиты</span>
            <span class="lg"><i style="background:var(--s2)"></i>Посетители</span>
          </div>
          <div class="plot" id="plotTl"></div>
          <div class="tw">${tableTwin(days.map((d,i)=>[d,nf(visits[i]),nf(users[i])]),['Дата','Визиты','Посетители'])}</div>
        </div>
        <div class="card">
          <div class="card-head"><div><div class="card-t">Источники трафика</div><div class="card-sub">визитов за период</div></div>
            <button class="tbtn" onclick="toggleTable(this)">Таблица</button></div>
          <div id="plotSrc"></div>
          <div class="tw">${tableTwin((src.data||[]).map(r=>[r.dimensions[0].name,nf(r.metrics[0])]),['Источник','Визиты'])}</div>
        </div>
        <div class="card">
          <div class="card-head"><div><div class="card-t">Устройства</div><div class="card-sub">визитов за период</div></div>
            <button class="tbtn" onclick="toggleTable(this)">Таблица</button></div>
          <div id="plotDev"></div>
          <div class="tw">${tableTwin((dev.data||[]).map(r=>[r.dimensions[0].name,nf(r.metrics[0])]),['Устройство','Визиты'])}</div>
        </div>
        <div class="card wide">
          <div class="card-head"><div><div class="card-t">Популярные страницы</div><div class="card-sub">топ-10 по визитам</div></div></div>
          ${tableTwin((pg.data||[]).map(r=>[r.dimensions[0].name,nf(r.metrics[0])]),['Страница','Визиты'])}
        </div>
      </div>`;

    lineChart($('plotTl'),{labels:shortD,tipLabels:days,series:[
      {name:'Визиты',color:'#3987e5',values:visits},
      {name:'Посетители',color:'#d95926',values:users}]});
    barList($('plotSrc'),(src.data||[]).map(r=>({label:shortSrc(r.dimensions[0].name),value:r.metrics[0]})),'var(--s1)');
    barList($('plotDev'),(dev.data||[]).map(r=>({label:r.dimensions[0].name,value:r.metrics[0]})),'var(--s1)');
    analyticsLoaded=true;
  }catch(e){
    box.innerHTML=`<div class="note"><b>Не удалось получить данные Метрики.</b><br>
      <code>${esc(e.message)}</code>
      <ol><li>Проверьте, что в свойствах скрипта заданы <code>METRIKA_TOKEN</code> и <code>METRIKA_COUNTER</code>.</li>
      <li>Токен должен иметь права <code>metrika:read</code>, а аккаунт — доступ к счётчику ${esc(ANALYTICS.counter)}.</li>
      <li>Запустите в редакторе Apps Script функцию <code>testSetup()</code> — она покажет, что именно не так.</li></ol></div>`
      + setupNote();
  }
}

const kpi=(l,v,s)=>`<div class="kpi"><div class="kpi-l">${esc(l)}</div><div class="kpi-v">${v}</div>${s?`<div class="kpi-s">${esc(s)}</div>`:''}</div>`;

function setupNote(){
  return `<div class="note">
    <b>Почему вкладка не работала со статистикой Tilda.</b>
    Страница <code>stats.tilda.ru</code> закрыта логином и запрещает встраивание в iframe
    (заголовок <code>X-Frame-Options</code>), а в публичном API Tilda есть только проекты и страницы —
    методов статистики там нет. Поэтому данные берём из Яндекс.Метрики, которая уже стоит на сайте.
    <ol>
      <li>Разверните <code>proxy.gs</code> как веб-приложение Apps Script.</li>
      <li>Получите OAuth-токен Яндекса с правом <code>metrika:read</code> на <a href="https://oauth.yandex.ru/" target="_blank" rel="noopener">oauth.yandex.ru</a>.</li>
      <li>Впишите токен и номер счётчика в свойства скрипта.</li>
      <li>Вставьте URL развёртывания и <code>ACCESS_KEY</code> в объект <code>ANALYTICS</code> в начале этого файла.</li>
    </ol>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" href="https://metrika.yandex.ru/dashboard?id=${esc(ANALYTICS.counter)}" target="_blank" rel="noopener">Открыть Метрику ↗</a>
      <a class="btn" href="${esc(ANALYTICS.tilda)}" target="_blank" rel="noopener">Открыть статистику Tilda ↗</a>
    </div></div>`;
}

/* ══════════════════════════════════════════════════════════════
   7. СТАРТ
   ══════════════════════════════════════════════════════════════ */
renderChips(); emptyChat(); loadAll(false);
setInterval(()=>loadAll(true),30000);

let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(tab===2&&analyticsLoaded)loadAnalytics();},250);});
</script>
