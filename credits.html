<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OpenAI — баланс и расходы</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14; --surface:#13161e; --surface2:#1a1e2a; --surface3:#222739;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
  --accent:#6c63ff; --accent-dim:rgba(108,99,255,.14);
  --text:#e8eaf0; --text2:#b6bccb; --muted:#8b90a0; --muted2:#666d80;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --grid:rgba(255,255,255,.055);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Golos Text',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:7px;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input{font:inherit;}
a{color:#8b84ff;}

.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;height:54px;padding:0 20px;background:rgba(19,22,30,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.brand{font-family:'Unbounded',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px;white-space:nowrap;}
.spacer{flex:1;}
.chips{display:flex;gap:6px;}
.chip{padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:500;background:var(--surface2);border:1px solid var(--border);color:var(--muted);white-space:nowrap;transition:.15s;}
.chip:hover{color:var(--text);border-color:var(--border2);}
.chip.on{background:var(--accent-dim);border-color:rgba(108,99,255,.45);color:#b5b0ff;}
.icobtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s;flex-shrink:0;}
.icobtn:hover{color:var(--text);border-color:var(--border2);background:var(--surface2);}
.icobtn.spin svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}

.hero{background:linear-gradient(145deg,rgba(108,99,255,.1),rgba(108,99,255,.02) 55%),var(--surface);border:1px solid rgba(108,99,255,.2);border-radius:20px;padding:24px 26px;margin-bottom:14px;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;}
.hero-main{flex:1;min-width:260px;}
.hero-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;}
.hero-v{font-size:56px;font-weight:600;line-height:1;margin-top:12px;letter-spacing:-.03em;}
.hero-v.low{color:var(--warn);}
.hero-v.crit{color:var(--crit);}
.hero-note{font-size:12px;color:var(--muted2);margin-top:12px;line-height:1.6;max-width:460px;}
.track{height:8px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;margin-top:18px;max-width:460px;}
.track i{display:block;height:100%;border-radius:5px;background:var(--s1);transition:width .6s cubic-bezier(.4,0,.2,1);}
.track.warn i{background:var(--warn);} .track.crit i{background:var(--crit);}
.trackl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted2);margin-top:7px;max-width:460px;}
.hero-side{display:flex;flex-direction:column;gap:12px;min-width:190px;}
.fact{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:13px;padding:12px 15px;}
.fact-l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);font-weight:600;}
.fact-v{font-size:19px;font-weight:600;margin-top:6px;}
.fact-v .st{font-size:12px;font-weight:500;color:var(--muted);margin-left:5px;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:15px 17px;}
.kpi-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;}
.kpi-v{font-size:25px;font-weight:600;margin-top:8px;line-height:1;letter-spacing:-.02em;}
.kpi-s{font-size:11px;color:var(--muted2);margin-top:7px;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:17px 19px 15px;min-width:0;}
.card.wide{grid-column:1/-1;}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:2px;}
.card-t{font-size:13.5px;font-weight:600;}
.card-sub{font-size:11px;color:var(--muted2);margin-top:4px;}
.tbtn{font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:7px;padding:4px 9px;flex-shrink:0;}
.tbtn:hover{color:var(--text);border-color:var(--border2);}
.plot{position:relative;margin-top:12px;}
.plot svg{display:block;width:100%;}
.tip{position:absolute;pointer-events:none;background:#0a0c12;border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:11.5px;white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:0 8px 28px rgba(0,0,0,.6);z-index:20;}
.tip b{font-weight:600;display:block;margin-bottom:5px;font-size:11px;color:var(--muted);}

.bars{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.bar{display:grid;grid-template-columns:minmax(90px,40%) 1fr auto;align-items:center;gap:11px;}
.bar-l{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-tr{height:9px;background:rgba(255,255,255,.045);border-radius:5px;overflow:hidden;}
.bar-f{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.bar-v{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;min-width:62px;}

table.dt{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px;}
table.dt th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);}
table.dt th.num,table.dt td.num{text-align:right;}
table.dt td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.035);font-variant-numeric:tabular-nums;}
table.dt td:first-child{font-variant-numeric:normal;color:var(--text2);}
table.dt tr:last-child td{border-bottom:none;}
.tscroll{overflow-x:auto;}
.tw{display:none;max-height:300px;overflow:auto;}
.tw.on{display:block;}

.note{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:13px;padding:15px 17px;font-size:12.5px;line-height:1.65;color:var(--text2);margin-bottom:14px;}
.note b{color:var(--text);}
.note code{background:var(--surface3);padding:1px 6px;border-radius:5px;font-size:11.5px;font-family:ui-monospace,monospace;}
.note ol{margin:10px 0 0 18px;} .note li{margin-bottom:6px;}
.load{display:flex;align-items:center;justify-content:center;gap:11px;color:var(--muted);font-size:12.5px;padding:50px;}
.sp{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
.empty{padding:30px;text-align:center;color:var(--muted2);font-size:12.5px;}

/* модалка сверки баланса */
.ov{position:fixed;inset:0;background:rgba(5,6,10,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.ov.on{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:24px;width:100%;max-width:420px;}
.modal h3{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;margin-bottom:8px;}
.modal p{font-size:12.5px;color:var(--muted);line-height:1.65;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);font-weight:600;margin-bottom:7px;}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:11px 13px;color:var(--text);font-size:14px;outline:none;}
.field input:focus{border-color:var(--accent);}
.mrow{display:flex;gap:9px;margin-top:20px;}
.btn{border:1px solid var(--border);border-radius:11px;padding:11px 16px;font-size:12.5px;font-weight:500;color:var(--text2);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s;text-decoration:none;background:var(--surface2);}
.btn:hover{border-color:var(--border2);color:var(--text);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;flex:1;}
.btn.pri:hover{background:#5b52f0;}

@media(max-width:640px){
  .top{padding:0 14px;gap:8px;} .brand span{display:none;}
  .wrap{padding:14px 14px 50px;}
  .hero{padding:20px;gap:18px;} .hero-v{font-size:42px;}
  .hero-side{flex-direction:row;width:100%;} .fact{flex:1;}
  .cards{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand">💳 <span>OpenAI Credits</span></div>
  <div class="spacer"></div>
  <div class="chips" id="chips"></div>
  <button class="icobtn" id="gear" title="Сверить баланс">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <button class="icobtn" id="refresh" title="Обновить">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
  </button>
</div>

<div class="wrap" id="wrap"><div class="load"><div class="sp"></div> Загрузка…</div></div>

<div class="ov" id="ov">
  <div class="modal">
    <h3>Сверка баланса</h3>
    <p>У OpenAI нет публичного метода «сколько осталось на счету» — по API отдаётся только расход.
       Поэтому один раз впишите сюда сумму с
       <a href="https://platform.openai.com/settings/organization/billing/overview" target="_blank" rel="noopener">страницы биллинга</a>
       и дату, когда вы её посмотрели. Дальше страница сама вычитает из неё расходы по дням.</p>
    <div class="field"><label>Баланс на дату, $</label><input type="number" id="fAmt" step="0.01" min="0" placeholder="50.00"></div>
    <div class="field"><label>Дата сверки</label><input type="date" id="fDate"></div>
    <div class="field"><label>Предупреждать, когда останется меньше, $</label><input type="number" id="fLow" step="1" min="0" placeholder="10"></div>
    <div class="mrow">
      <button class="btn" id="cancel">Отмена</button>
      <button class="btn pri" id="save">Сохранить</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   НАСТРОЙКА: сюда — URL прокси Apps Script (proxy.gs) и ваш ACCESS_KEY
   Ключ OpenAI в этот файл НЕ вписывается: страница публичная,
   его забрал бы любой, кто откроет исходный код.
   ══════════════════════════════════════════════════════════════ */
const PROXY = "";   // ← https://script.google.com/macros/s/.../exec
const KEY   = "";   // ← ACCESS_KEY из свойств скрипта

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = v => '$'+(Math.abs(v)<0.01&&v!==0 ? v.toFixed(4) : v.toFixed(2));
const nf  = n => (Number(n)||0).toLocaleString('ru-RU');
const dayKey = ts => new Date(ts*1000).toISOString().slice(0,10);
const ruDate = k => {const [y,m,d]=k.split('-'); return `${d}.${m}`;};

/* ── настройки пользователя (в браузере) ── */
const DEF={amount:0,date:'',low:10};
function loadCfg(){ try{return {...DEF,...JSON.parse(localStorage.getItem('oai-cfg')||'{}')};}catch(e){return {...DEF};} }
function saveCfg(c){ try{localStorage.setItem('oai-cfg',JSON.stringify(c));}catch(e){} }
let cfg=loadCfg(), period=30, busy=false;

/* ── графики ── */
const rTop=(x,y,w,h,r)=>{r=Math.max(0,Math.min(r,w/2,h));
  return `M${x} ${y+h}L${x} ${y+r}Q${x} ${y} ${x+r} ${y}L${x+w-r} ${y}Q${x+w} ${y} ${x+w} ${y+r}L${x+w} ${y+h}Z`;};

function colChart(host,{labels,values,tipLabels,color}){
  const W=host.clientWidth||600,H=230,P={l:52,r:14,t:16,b:26};
  const n=labels.length;
  if(!n){host.innerHTML='<div class="empty">Нет данных за период</div>';return;}
  const max=Math.max(0.0001,...values);
  const slot=(W-P.l-P.r)/n, bw=Math.max(3,Math.min(26,slot-2));
  const Y=v=>P.t+(H-P.t-P.b)*(1-v/max), X=i=>P.l+i*slot+(slot-bw)/2;

  const grid=[],ylab=[];
  for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);
    grid.push(`<line x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`);
    ylab.push(`<text x="${P.l-9}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted2)">${usd(v)}</text>`);}
  const every=Math.max(1,Math.ceil(n/7)),xlab=[];
  labels.forEach((l,i)=>{if(i%every===0||i===n-1)
    xlab.push(`<text x="${(X(i)+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--muted2)">${esc(l)}</text>`);});

  const mx=values.indexOf(max);
  const bars=values.map((v,i)=>{const h=Math.max(v>0?2:0,(H-P.t-P.b)-(Y(v)-P.t));
    return h?`<path d="${rTop(X(i),Y(v),bw,h,4)}" fill="${color}" opacity="${i===mx?1:.82}" data-i="${i}"/>`:'';}).join('');
  const lbl=max>0?`<text x="${(X(mx)+bw/2).toFixed(1)}" y="${(Y(max)-7).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--text2)">${usd(max)}</text>`:'';

  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}">${grid.join('')}${ylab.join('')}${xlab.join('')}${bars}${lbl}
    <rect id="hit" x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/></svg><div class="tip"></div>`;

  const svg=host.querySelector('svg'),tip=host.querySelector('.tip');
  const move=e=>{const r=svg.getBoundingClientRect();
    const px=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*W;
    let i=Math.floor((px-P.l)/slot); i=Math.max(0,Math.min(n-1,i));
    svg.querySelectorAll('path[data-i]').forEach(p=>p.setAttribute('opacity',+p.dataset.i===i?1:.45));
    tip.innerHTML=`<b>${esc(tipLabels?tipLabels[i]:labels[i])}</b>${usd(values[i])}`;
    tip.style.opacity=1;
    const tw=tip.offsetWidth,left=(X(i)+bw/2)/W*r.width;
    tip.style.left=Math.max(4,Math.min(r.width-tw-4,left-tw/2))+'px'; tip.style.top='0px';};
  svg.addEventListener('mousemove',move);
  svg.addEventListener('touchmove',move,{passive:true});
  svg.addEventListener('mouseleave',()=>{tip.style.opacity=0;
    svg.querySelectorAll('path[data-i]').forEach(p=>p.setAttribute('opacity',+p.dataset.i===mx?1:.82));});
}

function barList(host,items,color){
  if(!items.length){host.innerHTML='<div class="empty">Нет данных</div>';return;}
  const max=Math.max(...items.map(i=>i.value))||1;
  host.innerHTML=`<div class="bars">${items.map(i=>`
    <div class="bar" title="${esc(i.label)}: ${usd(i.value)}">
      <div class="bar-l">${esc(i.label)}</div>
      <div class="bar-tr"><div class="bar-f" style="width:${(i.value/max*100).toFixed(1)}%;background:${color}"></div></div>
      <div class="bar-v">${usd(i.value)}</div>
    </div>`).join('')}</div>`;
}
const table=(rows,head)=>`<div class="tscroll"><table class="dt"><thead><tr>${head.map((h,i)=>`<th class="${i?'num':''}">${esc(h)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'num':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function toggleTable(btn){const tw=btn.closest('.card').querySelector('.tw');
  tw.classList.toggle('on'); btn.textContent=tw.classList.contains('on')?'График':'Таблица';}

/* ── загрузка ── */
function api(report,days){
  return fetch(`${PROXY}?${new URLSearchParams({src:'openai',report,days,key:KEY})}`)
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(j=>{if(j.error)throw new Error(j.error);return j;});
}

function renderChips(){
  $('chips').innerHTML=[7,30,90].map(d=>
    `<button class="chip${period===d?' on':''}" data-d="${d}">${d} дн.</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{period=+b.dataset.d;load();});
}

async function load(){
  if(!PROXY){ $('wrap').innerHTML=setupNote(); return; }
  if(busy) return; busy=true; $('refresh').classList.add('spin');
  const stale=$('wrap').querySelector('.kpis');
  if(stale) $('wrap').style.opacity=.5; else $('wrap').innerHTML='<div class="load"><div class="sp"></div> Запрашиваю OpenAI…</div>';

  // сколько дней нужно: максимум из выбранного периода и срока с даты сверки
  let needDays=period;
  if(cfg.date){
    const d=Math.ceil((Date.now()-new Date(cfg.date+'T00:00:00Z').getTime())/864e5);
    if(d>needDays) needDays=Math.min(180,d);
  }
  try{
    const [costs,models]=await Promise.all([api('costs',needDays),api('models',needDays)]);
    paint(costs,models);
  }catch(e){
    $('wrap').innerHTML=`<div class="note"><b>Не удалось получить данные OpenAI.</b><br><code>${esc(e.message)}</code>
      <ol><li>Ключ должен быть <b>admin</b>-ключом (<code>sk-admin-…</code>) — обычный <code>sk-proj-…</code> к Costs API не допускается.</li>
      <li>Проверьте <code>OPENAI_ADMIN_KEY</code> в свойствах скрипта и запустите <code>testSetup()</code> в редакторе Apps Script.</li></ol></div>`+setupNote();
  }finally{ busy=false; $('refresh').classList.remove('spin'); $('wrap').style.opacity=1; }
}

function paint(costs,models){
  /* расход по дням */
  const byDay={}, byItem={};
  (costs.buckets||[]).forEach(b=>{
    const k=dayKey(b.start_time); byDay[k]=byDay[k]||0;
    (b.results||[]).forEach(r=>{
      const v=(r.amount&&r.amount.value)||0;
      byDay[k]+=v;
      const item=r.line_item||'Прочее';
      byItem[item]=(byItem[item]||0)+v;
    });
  });
  const allDays=Object.keys(byDay).sort();
  const win=allDays.slice(-period);
  const vals=win.map(k=>byDay[k]);

  const today=new Date().toISOString().slice(0,10);
  const spentToday=byDay[today]||0;
  const last7=allDays.slice(-7).reduce((s,k)=>s+byDay[k],0);
  const spentPeriod=vals.reduce((a,b)=>a+b,0);
  const avg7=last7/7;

  /* расчётный остаток */
  let rem=null, spentSince=0;
  if(cfg.amount>0&&cfg.date){
    spentSince=allDays.filter(k=>k>=cfg.date).reduce((s,k)=>s+byDay[k],0);
    rem=cfg.amount-spentSince;
  }
  const low=Number(cfg.low)||0;
  const state = rem===null?'':(rem<=low*0.4?'crit':rem<=low?'low':'');
  const pct = rem===null?0:Math.max(0,Math.min(100,rem/cfg.amount*100));
  const daysLeft = (rem!==null&&avg7>0)?rem/avg7:null;
  const untilDate = daysLeft!==null
    ? new Date(Date.now()+Math.max(0,daysLeft)*864e5).toLocaleDateString('ru-RU',{day:'2-digit',month:'long'}) : null;

  /* модели */
  const byModel={};
  (models.buckets||[]).forEach(b=>(b.results||[]).forEach(r=>{
    const m=r.model||'—';
    byModel[m]=byModel[m]||{req:0,inp:0,out:0};
    byModel[m].req+=r.num_model_requests||0;
    byModel[m].inp+=r.input_tokens||0;
    byModel[m].out+=r.output_tokens||0;
  }));
  const modelRows=Object.entries(byModel).sort((a,b)=>b[1].req-a[1].req)
    .map(([m,v])=>[m,nf(v.req),nf(v.inp),nf(v.out)]);
  const itemRows=Object.entries(byItem).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([k,v])=>({label:k,value:v}));

  $('wrap').innerHTML=`
    <div class="hero">
      <div class="hero-main">
        <div class="hero-l">Расчётный остаток</div>
        <div class="hero-v ${state}">${rem===null?'—':usd(rem)}</div>
        ${rem===null
          ? `<div class="hero-note">Чтобы считать остаток, один раз впишите сумму с дашборда OpenAI и дату — кнопка ⚙ сверху.</div>`
          : `<div class="track ${state==='crit'?'crit':state==='low'?'warn':''}"><i style="width:${pct.toFixed(1)}%"></i></div>
             <div class="trackl"><span>потрачено ${usd(spentSince)}</span><span>из ${usd(cfg.amount)}</span></div>
             <div class="hero-note">Оценка: баланс ${usd(cfg.amount)} на ${esc(new Date(cfg.date).toLocaleDateString('ru-RU'))} минус расход по Costs API.
               Точную цифру всегда показывает <a href="https://platform.openai.com/settings/organization/billing/overview" target="_blank" rel="noopener">дашборд OpenAI</a> — сверяйтесь раз в пару недель.</div>`}
      </div>
      <div class="hero-side">
        <div class="fact"><div class="fact-l">В среднем за день</div><div class="fact-v">${usd(avg7)}<span class="st">за 7 дн.</span></div></div>
        <div class="fact"><div class="fact-l">Хватит примерно до</div><div class="fact-v">${
          untilDate ? esc(untilDate)+`<span class="st">${Math.round(daysLeft)} дн.</span>` : '—'}</div></div>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="kpi-l">Сегодня</div><div class="kpi-v">${usd(spentToday)}</div><div class="kpi-s">${esc(new Date().toLocaleDateString('ru-RU'))}</div></div>
      <div class="kpi"><div class="kpi-l">За 7 дней</div><div class="kpi-v">${usd(last7)}</div><div class="kpi-s">${usd(avg7)} в день</div></div>
      <div class="kpi"><div class="kpi-l">За ${period} дней</div><div class="kpi-v">${usd(spentPeriod)}</div><div class="kpi-s">${win.length} дней с данными</div></div>
      <div class="kpi"><div class="kpi-l">Прогноз на 30 дней</div><div class="kpi-v">${usd(avg7*30)}</div><div class="kpi-s">по темпу недели</div></div>
    </div>

    <div class="cards">
      <div class="card wide">
        <div class="card-head">
          <div><div class="card-t">Расход по дням</div><div class="card-sub">Costs API · за ${period} дней · всего ${usd(spentPeriod)}</div></div>
          <button class="tbtn" onclick="toggleTable(this)">Таблица</button>
        </div>
        <div class="plot" id="plotDay"></div>
        <div class="tw">${table(win.map(k=>[k,usd(byDay[k])]).reverse(),['Дата','Расход'])}</div>
      </div>
      <div class="card">
        <div class="card-head"><div><div class="card-t">По статьям расхода</div><div class="card-sub">line_item · за ${period} дней</div></div>
          <button class="tbtn" onclick="toggleTable(this)">Таблица</button></div>
        <div id="plotItem"></div>
        <div class="tw">${table(itemRows.map(i=>[i.label,usd(i.value)]),['Статья','Сумма'])}</div>
      </div>
      <div class="card">
        <div class="card-head"><div><div class="card-t">Использование моделей</div><div class="card-sub">запросы и токены за период</div></div></div>
        ${modelRows.length?table(modelRows,['Модель','Запросы','Вход','Выход'])
          :'<div class="empty">Нет вызовов Chat Completions за период</div>'}
      </div>
    </div>`;

  colChart($('plotDay'),{labels:win.map(ruDate),tipLabels:win,values:vals,color:'#3987e5'});
  barList($('plotItem'),itemRows,'var(--s1)');
}

function setupNote(){
  return `<div class="note">
    <b>Страница ещё не подключена.</b> У OpenAI нет CORS для браузера, и admin-ключ нельзя класть в HTML —
    поэтому запросы идут через ваш собственный прокси на Google Apps Script.
    <ol>
      <li>Создайте admin-ключ: <a href="https://platform.openai.com/settings/organization/admin-keys" target="_blank" rel="noopener">platform.openai.com → Admin keys</a> (ключ вида <code>sk-admin-…</code>).</li>
      <li>Разверните <code>proxy.gs</code> как веб-приложение Apps Script, положите ключ в свойство <code>OPENAI_ADMIN_KEY</code>.</li>
      <li>Впишите URL развёртывания в <code>PROXY</code> и <code>ACCESS_KEY</code> в <code>KEY</code> в начале этого файла.</li>
      <li>Нажмите ⚙ и укажите текущий баланс с дашборда OpenAI — дальше страница считает сама.</li>
    </ol></div>`;
}

/* ── модалка ── */
$('gear').onclick=()=>{
  $('fAmt').value=cfg.amount||''; $('fDate').value=cfg.date||new Date().toISOString().slice(0,10);
  $('fLow').value=cfg.low; $('ov').classList.add('on');
};
$('cancel').onclick=()=>$('ov').classList.remove('on');
$('ov').onclick=e=>{if(e.target===$('ov'))$('ov').classList.remove('on');};
$('save').onclick=()=>{
  cfg={amount:parseFloat($('fAmt').value)||0,date:$('fDate').value||'',low:parseFloat($('fLow').value)||10};
  saveCfg(cfg); $('ov').classList.remove('on'); load();
};
$('refresh').onclick=()=>load();

renderChips(); load();
setInterval(()=>{if(!document.hidden)load();},5*60*1000);
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const p=$('plotDay');if(p)load();},300);});
</script>
</body>
</html>
